version: '3.8'

services:
  minecraft:
    container_name: minecraft
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"
      TZ: "America/Denver"
      DIFFICULTY: "2"
      FORCE_GAMEMODE: "true"
      SEED: "46182117"
      LEVEL: "Season4"
      OVERRIDE_SERVER_PROPERTIES: "true"
      OPS: "Kleptonite32"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: |-
        9d40019d-123c-4388-8d17-a809fdef781c
        00000000-0000-0000-0009-01f82d9086c3
        00000000-0000-0000-0009-01f07d66642c
        00000000-0000-0000-0009-01f2e1a5f34c
        00000000-0000-0000-0009-01f9dea6a54c
        00000000-0000-0000-0009-00000bfd20df
        12125355-27d2-4cef-983a-f528ed0b6a87
        00000000-0000-0000-0009-01fcdeb17903
        00000000-0000-0000-0009-01f8015fc755
        00000000-0000-0000-0009-01fcc855422f
        4de62950-65da-4979-a13f-f518c479c444
        1ae3fc17-bb9c-4f71-9f62-756d2827d41a
        00000000-0000-0000-0009-01f8a57a3d08
        2045c967-de5b-49ec-a64a-8efa30aec26d
      NETWORK_COMPRESSION_THRESHOLD: "256"
      SNOOPER_ENABLED: "false"
      GEYSER_BEDROCK_COMPRESSION_LEVEL: "0"
      VIEW_DISTANCE: "28"
      SIMULATION_DISTANCE: "6"
      SYNC_CHUNK_WRITES: "false"
      MAX_TICK_TIME: "120000"
      SPAWN_PROTECTION: "0"
      ENABLE_ROLLING_LOGS: "false"
      ENFORCE_SECURE_PROFILE: "false"
      ALLOW_FLIGHT: "true"
      JVM_DD_OPTS: "-Dpaper.playerconnection.keepalive=300"
      PLUGINS: |-
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/geyserpreview/versions/pr.6712/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/hurricane/versions/latest/builds/latest/downloads/spigot
        # https://github.com/ViaVersion/ViaVersion/releases/download/5.12.0/ViaVersion-5.12.0.jar
        https://github.com/ViaVersion/ViaVersion/releases/download/5.12.1/ViaVersion-5.12.1.jar

        # Temporarily disabled to test if Chunky is causing packet issues
        # https://hangarcdn.papermc.io/plugins/pop4959/Chunky/versions/1.4.40/PAPER/Chunky-Bukkit-1.4.40.jar
    volumes:
      - "/minecraft:/data"
    entrypoint: /bin/bash
    command: -c "curl -fsSL https://raw.githubusercontent.com/ryansabin/minecraft/main/init-auto-update.sh -o /tmp/init-auto-update.sh && chmod +x /tmp/init-auto-update.sh && /tmp/init-auto-update.sh && exec /start"
    restart: unless-stopped
